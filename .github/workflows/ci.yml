name: CI Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Verify JavaScript Syntax
        run: deno check app.js

      - name: Run Security Regression Tests
        run: node test_xss.js

      - name: Run Static Security Gate
        run: node test_security.js

      - name: Run Audio-Visual Telemetry Contract Test
        run: node test_telemetry.js

      - name: Run Audio Safety Gate
        run: node test_audio_safety.js

      - name: Run Visual Story Gate
        run: node test_visual_story.js

      - name: Run Runtime Diagnostics Contract Test
        run: node test_runtime_diagnostics.js
